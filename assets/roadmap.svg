<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290">
  <!-- Edit a row: change the bar's final width (620 = 100%) and the % label -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .t { fill: #e6edf3; font-size: 20px; font-weight: 700; }
      .k { fill: #c9d1d9; font-size: 16px; font-weight: 600; }
      .v { fill: #58a6ff; font-size: 15px; font-weight: 700; font-family: 'Fira Code', Consolas, monospace; }
      .s { font-size: 12px; font-weight: 600; }
      .track { fill: #21262d; }
      .fade { opacity: 0; animation: fade .6s ease-out forwards; }
      @keyframes fade { to { opacity: 1 } }
      .live { animation: live 1.6s ease-in-out infinite; }
      @keyframes live { 50% { opacity: .35 } }
    </style>
  </defs>

  <rect width="1000" height="290" rx="14" fill="#0d1117"/>
  <rect width="1000" height="290" rx="14" fill="none" stroke="#30363d"/>

  <!-- rows: y = 50 + 40*i -->
  <g transform="translate(0 50)">
    <text x="40" y="5" class="k">SQL</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="434" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:1.4s">70%</text>
    <text x="890" y="5" class="s" fill="#43d9ad">● done</text>
  </g>
  <g transform="translate(0 90)">
    <text x="40" y="5" class="k">Data Modeling</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="372" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:1.6s">60%</text>
    <text x="890" y="5" class="s" fill="#43d9ad">● done</text>
  </g>
  <g transform="translate(0 130)">
    <text x="40" y="5" class="k">Python</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="403" dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:1.8s">65%</text>
    <text x="890" y="5" class="s live" fill="#f9c74f">● learning</text>
  </g>
  <g transform="translate(0 170)">
    <text x="40" y="5" class="k">Spark</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="186" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:2s">30%</text>
    <text x="890" y="5" class="s" fill="#8b949e">○ next</text>
  </g>
  <g transform="translate(0 210)">
    <text x="40" y="5" class="k">Airflow</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="124" dur="1.4s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:2.2s">20%</text>
    <text x="890" y="5" class="s" fill="#8b949e">○ planned</text>
  </g>
  <g transform="translate(0 250)">
    <text x="40" y="5" class="k">AWS / GCP</text>
    <rect x="200" y="-8" width="620" height="14" rx="7" class="track"/>
    <rect x="200" y="-8" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" from="0" to="124" dur="1.4s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
    <text x="836" y="5" class="v fade" style="animation-delay:2.4s">20%</text>
    <text x="890" y="5" class="s" fill="#8b949e">○ planned</text>
  </g>
</svg>
