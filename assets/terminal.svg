<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
  <!-- 14s loop: each line is revealed by animating its clip width (typing effect), then everything clears and replays -->
  <defs>
    <style>
      text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 17px; }
      .u { fill: #43d9ad; } .p { fill: #58a6ff; } .c { fill: #e6edf3; } .o { fill: #8b949e; } .h { fill: #f9c74f; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
    <clipPath id="l1"><rect x="40" y="70" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.0214;0.0786;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="100" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.1;0.1214;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="140" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.1571;0.2143;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="170" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.2357;0.2571;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="210" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.2929;0.35;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="240" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.3714;0.3929;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l7"><rect x="40" y="275" height="28" width="0"><animate attributeName="width" values="0;0;900;900;0;0" keyTimes="0;0.4143;0.4286;0.8929;0.9143;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect width="1000" height="310" rx="14" fill="#0d1117"/>
  <rect width="1000" height="310" rx="14" fill="none" stroke="#30363d"/>
  <path d="M0 14a14 14 0 0 1 14-14h972a14 14 0 0 1 14 14v26H0z" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" style="font-size:13px" class="o">quan@data: ~</text>

  <g clip-path="url(#l1)"><text x="40" y="90"><tspan class="u">quan@data</tspan><tspan class="p">:~$</tspan><tspan class="c"> whoami</tspan></text></g>
  <g clip-path="url(#l2)"><text x="40" y="120" class="o">→ Data Engineering student · Ho Chi Minh City, Vietnam</text></g>

  <g clip-path="url(#l3)"><text x="40" y="160"><tspan class="u">quan@data</tspan><tspan class="p">:~$</tspan><tspan class="c"> cat stack.txt</tspan></text></g>
  <g clip-path="url(#l4)"><text x="40" y="190" class="o">→ <tspan class="h">Python</tspan> · <tspan class="h">SQL</tspan> · Spark · Airflow · Kafka · Docker · AWS/GCP</text></g>

  <g clip-path="url(#l5)"><text x="40" y="230"><tspan class="u">quan@data</tspan><tspan class="p">:~$</tspan><tspan class="c"> ./current_focus.sh</tspan></text></g>
  <g clip-path="url(#l6)"><text x="40" y="260" class="o">→ Building ETL pipelines, learning Spark &amp; open to collaborate 🤝</text></g>

  <g clip-path="url(#l7)"><text x="40" y="295"><tspan class="u">quan@data</tspan><tspan class="p">:~$</tspan><tspan class="c blink"> ▍</tspan></text></g>
</svg>
